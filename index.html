<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 禁止手機自動將數字轉為電話連結 -->
  <meta name="format-detection" content="telephone=no">
  <title>20260812-15 東京 🌸</title>
  <!-- Muji 簡約風 + 高透光玻璃質感 -->
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.65);
      --card-border: rgba(255, 255, 255, 0.5);
      --text-main: #2c2c2c;
      --text-sub: #444444;
      --accent-color: #333333;
      --tag-transport: rgba(232, 240, 254, 0.8);
      --tag-flight: rgba(254, 243, 199, 0.8);
      --tag-spot: rgba(230, 244, 234, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* 背景圖置中全螢幕覆蓋 */
    body { 
      background-image: url('https://upload.cc/i1/2026/08/08/7HkrZg.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      color: var(--text-main); 
      padding-bottom: 80px; 
      min-height: 100vh;
      -webkit-font-smoothing: antialiased; 
    }

    /* 頂部 Header 半透明效果 */
    header { 
      background: rgba(255, 255, 255, 0.65); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 20px; 
      border-bottom: 1px solid var(--card-border); 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      text-align: center; 
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: var(--text-main); text-decoration: none; }
    header h1 a, header h1 { color: inherit !important; text-decoration: none !important; }

    /* 天氣資訊列 */
    .weather-bar { 
      background: rgba(239, 236, 230, 0.6); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 16px; 
      font-size: 13px; 
      color: var(--text-sub); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--card-border); 
    }

    /* 日期天數切換按鈕 */
    .day-selector { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
    .day-selector::-webkit-scrollbar { display: none; }
    .day-btn { 
      flex: 0 0 auto; 
      padding: 8px 16px; 
      border-radius: 20px; 
      border: 1px solid var(--card-border); 
      background: rgba(255, 255, 255, 0.5); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 14px; 
      color: var(--text-sub); 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .day-btn.active { background: var(--text-main); color: #ffffff; border-color: var(--text-main); font-weight: 500; }

    /* 主要內容容器 */
    .container { padding: 16px; max-width: 500px; margin: 0 auto; }
    .page { display: none; }
    .page.active { display: block; }

    /* 左右雙欄卡片佈局 */
    .card-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: stretch;
    }

    /* 左側時間方塊 */
    .time-box {
      flex: 0 0 75px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .time-badge { font-size: 15px; font-weight: 700; color: var(--text-main); }
    .type-tag { font-size: 10px; padding: 2px 5px; border-radius: 4px; color: var(--text-sub); font-weight: 500; margin-top: 4px; }
    .type-transport { background: var(--tag-transport); }
    .type-flight { background: var(--tag-flight); }
    .type-spot { background: var(--tag-spot); }

    /* 右側行程內容方塊 */
    .card-content { 
      flex: 1;
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px; 
      padding: 12px 14px; 
      border: 1px solid var(--card-border); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
      position: relative;
    }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--text-main); padding-right: 50px; }
    .card-desc { font-size: 12.5px; color: var(--text-sub); line-height: 1.4; white-space: pre-line; }

    /* 編輯與刪除按鈕 */
    .edit-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.2s;
      padding: 2px;
    }
    .edit-btn:hover { opacity: 1; }

    /* 入境 QR Code & Skyliner 按鈕區 */
    .member-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .member-btn { padding: 6px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.8); border-radius: 6px; font-size: 12px; color: var(--text-main); text-align: center; cursor: pointer; font-weight: 500; }

    /* 新增行程表單區塊 */
    .add-form { margin-top: 20px; background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 16px; border-radius: 14px; border: 1px solid var(--card-border); }
    .add-form h3 { font-size: 14px; margin-bottom: 10px; color: var(--text-main); }
    .add-form input, .add-form select, .add-form textarea { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: rgba(255,255,255,0.8); }
    .add-form button { width: 100%; padding: 10px; background: var(--text-main); color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; }

    /* 底部 Tab 導覽列 */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-sub); text-decoration: none; cursor: pointer; }
    .nav-item.active { color: var(--text-main); font-weight: 600; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }

    /* Pop-up 彈出視窗通用樣式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      width: 85%;
      max-width: 360px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0 5px;
    }

    .modal-close:hover { color: #000; }
    .modal-img { width: 100%; max-width: 280px; height: auto; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>20260812-15 東京 🌸</h1>
  </header>

  <!-- 即時天氣列 -->
  <div class="weather-bar">
    <span>📍 東京, 日本</span>
    <span>🌤️ 28°C (預報：晴時多雲)</span>
  </div>

  <!-- 5 天按鈕列 -->
  <div class="day-selector">
    <button class="day-btn" onclick="switchDay('8-12')" id="btn-8-12">8/12 (三)</button>
    <button class="day-btn" onclick="switchDay('8-13')" id="btn-8-13">8/13 (四)</button>
    <button class="day-btn" onclick="switchDay('8-14')" id="btn-8-14">8/14 (五)</button>
    <button class="day-btn" onclick="switchDay('8-15')" id="btn-8-15">8/15 (六)</button>
    <button class="day-btn" onclick="switchDay('8-16')" id="btn-8-16">8/16 (日)</button>
  </div>

  <div class="container">
    <!-- 主頁面：每日行程 -->
    <div id="page-itinerary" class="page active">
      <div id="itinerary-list">載入行程中...</div>

      <!-- 手動新增行程 -->
      <div class="add-form">
        <h3>➕ 加插新行程</h3>
        <input type="time" id="newTime">
        <input type="text" id="newTitle" placeholder="景點/事項名稱">
        <select id="newType">
          <option value="spot">📍 景點/活動</option>
          <option value="transport">🚌 交通</option>
          <option value="flight">✈️ 航班/手續</option>
        </select>
        <textarea id="newDesc" placeholder="行程備註 (選填，可按 Enter 換行隔行)" rows="2" style="font-family: inherit;"></textarea>
        <input type="url" id="newMapUrl" placeholder="Google Maps 路線或地點連結 (選填)" style="font-size: 13px;">
        <button onclick="addNewSpot()">新增至當天行程</button>
      </div>
    </div>

    <!-- 資訊頁面 -->
    <div id="page-info" class="page">
      <div class="card-row">
        <div class="card-content" style="width:100%;">
          <div class="card-title">✈️ 航班資訊</div>
          <div class="card-desc" style="margin-top:8px;">
            <b>去程：</b> 8/12 10:35 - 16:05 (PYTSKT)<br>
            <b>狀態：</b> Online Check-in 已完成
          </div>
        </div>
      </div>
      <div class="card-row">
        <div class="card-content" style="width:100%;">
          <div class="card-title">🏨 住宿與交通資訊</div>
          <div class="card-desc" style="margin-top:8px;">
            <b>交通：</b> 成田機場 ➔ 京成上野 (搭乘 Skyliner)
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部固定導覽列 -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('itinerary')" id="nav-itinerary">
      <div class="nav-icon">📅</div>
      <span>行程</span>
    </div>
    <div class="nav-item" onclick="switchTab('info')" id="nav-info">
      <div class="nav-icon">🧳</div>
      <span>資訊/住宿</span>
    </div>
  </nav>

  <!-- QR Code / 換票 Pop-up Modal -->
  <div id="qr-modal" class="modal-overlay" onclick="closeQRModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeQRModal()">✕</button>
      <h3 id="modal-qr-name" style="margin: 0 0 10px 0; color: #333; font-size: 16px;"></h3>
      <img id="modal-qr-img" class="modal-img" src="" alt="圖片">
    </div>
  </div>

  <!-- ✏️ 行程編輯 Pop-up Modal -->
  <div id="edit-modal" class="modal-overlay" onclick="document.getElementById('edit-modal').style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()" style="text-align: left;">
      <button class="modal-close" onclick="document.getElementById('edit-modal').style.display='none'">✕</button>
      <h3 style="margin-bottom: 12px; color: #333; font-size: 16px;">✏️ 編輯行程</h3>
      
      <input type="hidden" id="edit-id">
      <label style="font-size: 12px; color: #666;">時間：</label>
      <input type="time" id="edit-time" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px;">
      
      <label style="font-size: 12px; color: #666;">標題：</label>
      <input type="text" id="edit-title" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px;">
      
      <label style="font-size: 12px; color: #666;">分類：</label>
      <select id="edit-type" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px;">
        <option value="spot">📍 景點/活動</option>
        <option value="transport">🚌 交通</option>
        <option value="flight">✈️ 航班/手續</option>
      </select>

      <label style="font-size: 12px; color: #666;">備註 (可 Enter 隔行)：</label>
      <textarea id="edit-desc" rows="3" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;"></textarea>

      <label style="font-size: 12px; color: #666;">Google Maps 路線連結：</label>
      <input type="url" id="edit-mapUrl" placeholder="Google Maps 路線連結 (選填)" style="width: 100%; padding: 8px; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;">

      <button onclick="saveEditSpot()" style="width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">儲存修改</button>
    </div>
  </div>

  <!-- 串接 Firebase CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyCXUOhXBoeUlYNAgLlfavfjBcX3A7hjO5M",
      authDomain: "tokyo-1bf69.firebaseapp.com",
      projectId: "tokyo-1bf69",
      storageBucket: "tokyo-1bf69.firebasestorage.app",
      messagingSenderId: "918263660407",
      appId: "1:918263660407:web:5fa52d2e7e95dcf0186b72",
      measurementId: "G-JXDX40G20R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.currentDay = '8-12';
    window.currentSpots = []; // 行程快取，防止屬性字串跳脫錯誤

    window.addEventListener('DOMContentLoaded', async () => {
      autoDetectToday();
      await initDefaultDay1Data();
      listenDayExpenses(window.currentDay);
    });

    // 自動偵測當前日期
    function autoDetectToday() {
      const today = new Date();
      const month = today.getMonth() + 1;
      const date = today.getDate();
      const todayStr = `${month}-${date}`;
      
      if (['8-12', '8-13', '8-14', '8-15', '8-16'].includes(todayStr)) {
        switchDay(todayStr);
      } else {
        switchDay('8-12');
      }
    }

    // 切換天數
    window.switchDay = function(dayStr) {
      window.currentDay = dayStr;
      document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${dayStr}`);
      if(activeBtn) activeBtn.classList.add('active');

      listenDayExpenses(dayStr);
    };

    // Tab 切換
    window.switchTab = function(tabName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      document.getElementById(`page-${tabName}`).classList.add('active');
      document.getElementById(`nav-${tabName}`).classList.add('active');
    };

    // 監聽並自動按時間排序
    function listenDayExpenses(dayStr) {
      const q = query(collection(db, "itinerary"), where("day", "==", dayStr));
      
      onSnapshot(q, (snapshot) => {
        let spots = [];
        snapshot.forEach((doc) => {
          spots.push({ id: doc.id, ...doc.data() });
        });

        // 按時間自動排序
        spots.sort((a, b) => {
          const timeA = (a.time && a.time.trim() !== '') ? parseInt(a.time.replace(':', ''), 10) : 9999;
          const timeB = (b.time && b.time.trim() !== '') ? parseInt(b.time.replace(':', ''), 10) : 9999;
          return timeA - timeB;
        });

        window.currentSpots = spots; // 寫入快取
        renderItinerary(spots);
      });
    }

    // 渲染卡片
    function renderItinerary(spots) {
      const listEl = document.getElementById('itinerary-list');
      listEl.innerHTML = '';

      if (!spots || spots.length === 0) {
        listEl.innerHTML = '<div class="card-row"><div class="card-content" style="text-align:center; color:#666;">這一天還沒有行程，可以在下方新增喔！</div></div>';
        return;
      }

      spots.forEach(spot => {
        const row = document.createElement('div');
        row.className = 'card-row';

        let typeClass = 'type-spot';
        let typeName = '📍 景點';
        if (spot.type === 'transport') { typeClass = 'type-transport'; typeName = '🚌 交通'; }
        if (spot.type === 'flight') { typeClass = 'type-flight'; typeName = '✈️ 航班'; }

        // 按鈕區 (入境 QR Code & Skyliner 換票)
        let qrSection = '';
        const titleText = spot.title || '';
        
        if (titleText.includes('入境QR Code')) {
          qrSection = `
            <div class="member-btns" style="margin-top: 10px;">
              <div class="member-btn" onclick="toggleQR('美婷')">美婷</div>
              <div class="member-btn" onclick="toggleQR('麗婷')">麗婷</div>
              <div class="member-btn" onclick="toggleQR('桃')">桃</div>
            </div>
          `;
        } else if ((titleText.includes('成田') && titleText.includes('京成上野')) || titleText.includes('Skyliner換票')) {
          qrSection = `
            <div class="member-btns" style="margin-top: 10px; grid-template-columns: repeat(2, 1fr);">
              <div class="member-btn" onclick="toggleSkyliner('location')">📍 換票地點</div>
              <div class="member-btn" onclick="toggleSkyliner('qr')">🎟️ 換票 QR Code</div>
            </div>
          `;
        }

        // Google Maps 導航按鈕
        let mapBtnSection = '';
        if (spot.mapUrl && spot.mapUrl.trim() !== '') {
          const safeMapUrl = spot.mapUrl.replace(/'/g, "%27").replace(/"/g, "&quot;");
          mapBtnSection = `
            <div style="margin-top: 8px;">
              <a href="${safeMapUrl}" target="_blank" rel="noopener noreferrer" style="display: inline-block; background-color: #4285F4; color: #ffffff; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold;">
                🗺️ 開啟 Google 地圖導航
              </a>
            </div>
          `;
        }

        row.innerHTML = `
          <!-- 左側時間框 -->
          <div class="time-box">
            <span class="time-badge">${spot.time || '未定'}</span>
            <span class="type-tag ${typeClass}">${typeName}</span>
          </div>

          <!-- 右側行程內容框 -->
          <div class="card-content">
            <div style="position: absolute; top: 8px; right: 8px; display: flex; gap: 6px;">
              <button class="edit-btn" onclick="openEditModal('${spot.id}')">✏️</button>
              <button class="edit-btn" onclick="deleteSpot('${spot.id}')">🗑️</button>
            </div>
            <div class="card-title">${titleText}</div>
            <div class="card-desc">${spot.desc || ''}</div>
            ${mapBtnSection}
            ${qrSection}
          </div>
        `;
        listEl.appendChild(row);
      });
    }
    
    // 安全開啟編輯彈出視窗
    window.openEditModal = function(id) {
      const spot = (window.currentSpots || []).find(s => s.id === id);
      if (!spot) return;

      document.getElementById('edit-id').value = spot.id || '';
      document.getElementById('edit-time').value = spot.time || '';
      document.getElementById('edit-title').value = spot.title || '';
      document.getElementById('edit-desc').value = spot.desc || '';
      document.getElementById('edit-type').value = spot.type || 'spot';

      const editMapEl = document.getElementById('edit-mapUrl');
      if (editMapEl) editMapEl.value = spot.mapUrl || '';

      document.getElementById('edit-modal').style.display = 'flex';
    };

    // 儲存編輯內容
    window.saveEditSpot = async function() {
      const id = document.getElementById('edit-id').value;
      const time = document.getElementById('edit-time').value;
      const title = document.getElementById('edit-title').value;
      const desc = document.getElementById('edit-desc').value;
      const type = document.getElementById('edit-type').value;
      const editMapEl = document.getElementById('edit-mapUrl');
      const mapUrl = editMapEl ? editMapEl.value : '';

      if (!id) return;

      const docRef = doc(db, "itinerary", id);
      await updateDoc(docRef, {
        time: time ? time.trim() : '',
        title: title ? title.trim() : '（未填寫標題）',
        type: type || 'spot',
        desc: desc ? desc.trim() : '',
        mapUrl: mapUrl ? mapUrl.trim() : ''
      });

      document.getElementById('edit-modal').style.display = 'none';
    };

    // 安全刪除行程
    window.deleteSpot = async function(id) {
      const spot = (window.currentSpots || []).find(s => s.id === id);
      const title = spot ? spot.title : '這筆行程';

      if (confirm(`⚠️ 確定要刪除「${title}」嗎？\n\n刪除後所有人的手機都會同步移除，無法復原喔！`)) {
        try {
          const docRef = doc(db, "itinerary", id);
          await deleteDoc(docRef);
        } catch (error) {
          alert("刪除失敗：" + error.message);
        }
      }
    };

    // 開啟 QR Code 彈出視窗
    window.toggleQR = function(name) {
      let imgFile = '';
      if (name === '美婷') imgFile = 'meiqr.png';
      if (name === '麗婷') imgFile = 'laiqr.png';
      if (name === '桃') imgFile = 'myqr.png';

      document.getElementById('modal-qr-name').innerText = `${name} 的 Visit Japan Web`;
      document.getElementById('modal-qr-img').src = imgFile;
      
      document.getElementById('qr-modal').style.display = 'flex';
    };

    // 關閉 Pop-up 視窗
    window.closeQRModal = function() {
      document.getElementById('qr-modal').style.display = 'none';
    };

    // 顯示 Skyliner 換票地點 / QR Code Pop-up
    window.toggleSkyliner = function(type) {
      let imgFile = '';
      let titleName = '';

      if (type === 'location') {
        imgFile = '換票地點.png';
        titleName = 'Skyliner 換票地點';
      } else if (type === 'qr') {
        imgFile = 'skylinerqr.png';
        titleName = 'Skyliner 換票 QR Code';
      }

      document.getElementById('modal-qr-name').innerText = titleName;
      document.getElementById('modal-qr-img').src = imgFile;
      document.getElementById('qr-modal').style.display = 'flex';
    };
    
    // 手動新增行程 (包含 Google Maps 連結)
    window.addNewSpot = async function() {
      const time = document.getElementById('newTime').value;
      const title = document.getElementById('newTitle').value;
      const type = document.getElementById('newType').value;
      const desc = document.getElementById('newDesc').value;
      const mapUrl = document.getElementById('newMapUrl').value;

      await addDoc(collection(db, "itinerary"), {
        day: window.currentDay,
        time: time ? time.trim() : '',
        title: title ? title.trim() : '（未填寫標題）',
        type: type || 'spot',
        desc: desc ? desc.trim() : '',
        mapUrl: mapUrl ? mapUrl.trim() : '',
        createdAt: new Date()
      });

      // 清空輸入欄位
      document.getElementById('newTime').value = '';
      document.getElementById('newTitle').value = '';
      document.getElementById('newDesc').value = '';
      document.getElementById('newMapUrl').value = '';
    };
    
    // 首次開啟網頁自動匯入 8/12 初始行程到資料庫
    async function initDefaultDay1Data() {
      const q = query(collection(db, "itinerary"), where("day", "==", "8-12"));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        const defaultSpots = [
          { day: '8-12', time: '07:15', title: '要上到巴士～～', type: 'transport', desc: '預計 07:15 - 07:30 上車' },
          { day: '8-12', time: '08:35', title: '到達機場', type: 'transport', desc: '準備辦理登機手續' },
          { day: '8-12', time: '10:35', title: '起飛 ➔ 成田機場', type: 'flight', desc: '10:35 - 16:05 (PYTSKT) << Online check-in 已完成' },
          { day: '8-12', time: '16:05', title: '到達成田機場 & 辦理入境QR Code', type: 'flight', desc: '點擊下方按鈕可查看個別 QR Code' },
          { day: '8-12', time: '17:30', title: '成田機場 ➔ 京成上野', type: 'transport', desc: '搭乘 Skyliner 前往上野' }
        ];

        for (const item of defaultSpots) {
          await addDoc(collection(db, "itinerary"), { ...item, createdAt: new Date() });
        }
      }
    }
  </script>
</body>
