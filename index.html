<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20260812-15 東京 🌸</title>
  <!-- Muji 簡約風 + 玻璃半透明質感 -->
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.85); /* 半透明白色背景 */
      --card-border: rgba(255, 255, 255, 0.4);
      --text-main: #2c2c2c;
      --text-sub: #555555;
      --accent-color: #333333;
      --tag-transport: #e8f0fe;
      --tag-flight: #fef3c7;
      --tag-spot: #e6f4ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* 背景圖置中全螢幕覆蓋 */
    body { 
      background-image: url('https://upload.cc/i1/2026/08/08/7HkrZg.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      color: var(--text-main); 
      padding-bottom: 80px; 
      min-height: 100vh;
      -webkit-font-smoothing: antialiased; 
    }

    /* 頂部 Header 半透明效果 */
    header { 
      background: rgba(255, 255, 255, 0.8); 
      backdrop-filter: blur(10px);
      padding: 16px 20px; 
      border-bottom: 1px solid var(--card-border); 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      text-align: center; 
    }
    header h1 { 
  font-size: 18px; 
  font-weight: 600; 
  letter-spacing: 1px; 
  color: var(--text-main); 
  text-decoration: none; /* 移除任何底線 */
}

/* 防止手機強制把它渲染成藍色連結 */
header h1 a, header h1 {
  color: inherit !important;
  text-decoration: none !important;
}
    /* 天氣資訊列 */
    .weather-bar { 
      background: rgba(239, 236, 230, 0.85); 
      backdrop-filter: blur(5px);
      padding: 8px 16px; 
      font-size: 13px; 
      color: var(--text-sub); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--card-border); 
    }

    /* 日期天數切換按鈕 */
    .day-selector { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
    .day-selector::-webkit-scrollbar { display: none; }
    .day-btn { 
      flex: 0 0 auto; 
      padding: 8px 16px; 
      border-radius: 20px; 
      border: 1px solid var(--card-border); 
      background: rgba(255, 255, 255, 0.7); 
      backdrop-filter: blur(5px);
      font-size: 14px; 
      color: var(--text-sub); 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .day-btn.active { background: var(--text-main); color: #ffffff; border-color: var(--text-main); font-weight: 500; }

    /* 主要內容容器 */
    .container { padding: 16px; max-width: 500px; margin: 0 auto; }
    .page { display: none; }
    .page.active { display: block; }

    /* 半透明行程卡片設計 */
    .card { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px; 
      padding: 16px; 
      margin-bottom: 12px; 
      border: 1px solid var(--card-border); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .time-badge { font-size: 14px; font-weight: 600; color: var(--text-main); background: rgba(0,0,0,0.06); padding: 2px 8px; border-radius: 4px; }
    .type-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; color: var(--text-sub); font-weight: 500; }
    .type-transport { background: var(--tag-transport); }
    .type-flight { background: var(--tag-flight); }
    .type-spot { background: var(--tag-spot); }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
    .card-desc { font-size: 13px; color: var(--text-sub); line-height: 1.4; }

    /* 入境 QR Code 按鈕區 */
    .member-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .member-btn { padding: 8px; background: rgba(255,255,255,0.9); border: 1px solid #ddd; border-radius: 8px; font-size: 13px; color: var(--text-main); text-align: center; cursor: pointer; font-weight: 500; }
    .qr-preview { margin-top: 10px; text-align: center; display: none; padding: 10px; background: white; border-radius: 8px; border: 1px dashed #ccc; }
    .qr-preview img { max-width: 100%; height: auto; border-radius: 6px; }

    /* 新增行程表單區塊 */
    .add-form { margin-top: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 16px; border-radius: 14px; border: 1px solid var(--card-border); }
    .add-form h3 { font-size: 14px; margin-bottom: 10px; color: var(--text-main); }
    .add-form input, .add-form select { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; }
    .add-form button { width: 100%; padding: 10px; background: var(--text-main); color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; }

    /* 底部 Tab 導覽列 */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-sub); text-decoration: none; cursor: pointer; }
    .nav-item.active { color: var(--text-main); font-weight: 600; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <header>
    <h1>20260812-15 東京 🌸</h1>
    <!-- 禁止手機瀏覽器把數字自動轉成電話連結 -->
<meta name="format-detection" content="telephone=no">
  </header>

  <!-- 即時天氣列 -->
  <div class="weather-bar">
    <span>📍 東京, 日本</span>
    <span>🌤️ 28°C (預報：晴時多雲)</span>
  </div>

  <!-- 5 天按鈕列 -->
  <div class="day-selector">
    <button class="day-btn" onclick="switchDay('8-12')" id="btn-8-12">8/12 (三)</button>
    <button class="day-btn" onclick="switchDay('8-13')" id="btn-8-13">8/13 (四)</button>
    <button class="day-btn" onclick="switchDay('8-14')" id="btn-8-14">8/14 (五)</button>
    <button class="day-btn" onclick="switchDay('8-15')" id="btn-8-15">8/15 (六)</button>
    <button class="day-btn" onclick="switchDay('8-16')" id="btn-8-16">8/16 (日)</button>
  </div>

  <div class="container">
    
    <!-- 主頁面：每日行程 -->
    <div id="page-itinerary" class="page active">
      <div id="itinerary-list">載入行程中...</div>

      <!-- 手動新增行程 (即時同步至 Firebase) -->
      <div class="add-form">
        <h3>➕ 加插新行程</h3>
        <input type="time" id="newTime">
        <input type="text" id="newTitle" placeholder="景點/事項名稱">
        <select id="newType">
          <option value="spot">📍 景點/活動</option>
          <option value="transport">🚌 交通</option>
          <option value="flight">✈️ 航班/手續</option>
        </select>
        <input type="text" id="newDesc" placeholder="備註細節">
        <button onclick="addNewSpot()">新增至當天行程</button>
      </div>
    </div>

    <!-- 資訊頁面 -->
    <div id="page-info" class="page">
      <div class="card">
        <div class="card-title">✈️ 航班資訊</div>
        <div class="card-desc" style="margin-top:8px;">
          <b>去程：</b> 8/12 10:35 - 16:05 (PYTSKT)<br>
          <b>狀態：</b> Online Check-in 已完成
        </div>
      </div>
      <div class="card">
        <div class="card-title">🏨 住宿與交通資訊</div>
        <div class="card-desc" style="margin-top:8px;">
          <b>交通：</b> 成田機場 ➔ 京成上野 (搭乘 Skyliner)
        </div>
      </div>
    </div>

  </div>

  <!-- 底部固定導覽列 -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('itinerary')" id="nav-itinerary">
      <div class="nav-icon">📅</div>
      <span>行程</span>
    </div>
    <div class="nav-item" onclick="switchTab('info')" id="nav-info">
      <div class="nav-icon">🧳</div>
      <span>資訊/住宿</span>
    </div>
  </nav>

  <!-- 串接 Firebase CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 使用你最新的 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCXUOhXBoeUlYNAgLlfavfjBcX3A7hjO5M",
      authDomain: "tokyo-1bf69.firebaseapp.com",
      projectId: "tokyo-1bf69",
      storageBucket: "tokyo-1bf69.firebasestorage.app",
      messagingSenderId: "918263660407",
      appId: "1:918263660407:web:5fa52d2e7e95dcf0186b72",
      measurementId: "G-JXDX40G20R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.currentDay = '8-12';

    window.addEventListener('DOMContentLoaded', async () => {
      autoDetectToday();
      await initDefaultDay1Data(); // 預先寫入 8/12 初始行程資料
      listenDayExpenses(window.currentDay);
    });

    // 自動偵測日期
    function autoDetectToday() {
      const today = new Date();
      const month = today.getMonth() + 1;
      const date = today.getDate();
      const todayStr = `${month}-${date}`;
      
      if (['8-12', '8-13', '8-14', '8-15', '8-16'].includes(todayStr)) {
        switchDay(todayStr);
      } else {
        switchDay('8-12');
      }
    }

    // 切換天數
    window.switchDay = function(dayStr) {
      window.currentDay = dayStr;
      document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${dayStr}`);
      if(activeBtn) activeBtn.classList.add('active');

      listenDayExpenses(dayStr);
    };

    // Tab 切換
    window.switchTab = function(tabName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      document.getElementById(`page-${tabName}`).classList.add('active');
      document.getElementById(`nav-${tabName}`).classList.add('active');
    };

    // 監聽並自動按時間排序
    function listenDayExpenses(dayStr) {
      const q = query(collection(db, "itinerary"), where("day", "==", dayStr));
      
      onSnapshot(q, (snapshot) => {
        let spots = [];
        snapshot.forEach((doc) => {
          spots.push({ id: doc.id, ...doc.data() });
        });

        // 按時間升冪自動排序
        spots.sort((a, b) => a.time.replace(':', '') - b.time.replace(':', ''));

        renderItinerary(spots);
      });
    }

    // 渲染卡片
    function renderItinerary(spots) {
      const listEl = document.getElementById('itinerary-list');
      listEl.innerHTML = '';

      if (spots.length === 0) {
        listEl.innerHTML = '<div class="card" style="text-align:center; color:#666;">這一天還沒有行程，可以在下方新增喔！</div>';
        return;
      }

      spots.forEach(spot => {
        const card = document.createElement('div');
        card.className = 'card';

        let typeClass = 'type-spot';
        let typeName = '📍 景點';
        if (spot.type === 'transport') { typeClass = 'type-transport'; typeName = '🚌 交通'; }
        if (spot.type === 'flight') { typeClass = 'type-flight'; typeName = '✈️ 航班/手續'; }

        let qrSection = '';
        if (spot.title.includes('入境QR Code')) {
          qrSection = `
            <div class="member-btns">
              <div class="member-btn" onclick="toggleQR('美婷')">美婷</div>
              <div class="member-btn" onclick="toggleQR('麗婷')">麗婷</div>
              <div class="member-btn" onclick="toggleQR('桃')">桃</div>
            </div>
            <div id="qr-display" class="qr-preview">
              <p id="qr-name" style="font-size:12px; color:#666; margin-bottom:5px;"></p>
              <img id="qr-img" src="" alt="QR Code 預覽區">
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-header">
            <span class="time-badge">${spot.time}</span>
            <span class="type-tag ${typeClass}">${typeName}</span>
          </div>
          <div class="card-title">${spot.title}</div>
          <div class="card-desc">${spot.desc || ''}</div>
          ${qrSection}
        `;
        listEl.appendChild(card);
      });
    }

    // 顯示成員 QR Code 預覽
    window.toggleQR = function(name) {
      const qrDisplay = document.getElementById('qr-display');
      const qrImg = document.getElementById('qr-img');
      const qrName = document.getElementById('qr-name');

      qrName.innerText = `${name} 的 Visit Japan Web 入境 QR Code`;
      qrImg.src = `https://via.placeholder.com/250x250?text=${encodeURIComponent(name)}+QR+Code`;
      qrDisplay.style.display = 'block';
    };

    // 手動新增行程
    window.addNewSpot = async function() {
      const time = document.getElementById('newTime').value;
      const title = document.getElementById('newTitle').value;
      const type = document.getElementById('newType').value;
      const desc = document.getElementById('newDesc').value;

      if (!time || !title) { alert('請填寫時間與景點名稱！'); return; }

      await addDoc(collection(db, "itinerary"), {
        day: window.currentDay,
        time: time,
        title: title,
        type: type,
        desc: desc,
        createdAt: new Date()
      });

      document.getElementById('newTime').value = '';
      document.getElementById('newTitle').value = '';
      document.getElementById('newDesc').value = '';
    };

    // 首次開啟網頁自動匯入 8/12 初始行程到資料庫
    async function initDefaultDay1Data() {
      const q = query(collection(db, "itinerary"), where("day", "==", "8-12"));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        const defaultSpots = [
          { day: '8-12', time: '07:15', title: '要上到巴士～～', type: 'transport', desc: '預計 07:15 - 07:30 上車' },
          { day: '8-12', time: '08:35', title: '到達機場', type: 'transport', desc: '準備辦理登機手續' },
          { day: '8-12', time: '10:35', title: '起飛 ➔ 成田機場', type: 'flight', desc: '10:35 - 16:05 (PYTSKT) << Online check-in 已完成' },
          { day: '8-12', time: '16:05', title: '到達成田機場 & 辦理入境QR Code', type: 'flight', desc: '點擊下方按鈕可查看個別 QR Code' },
          { day: '8-12', time: '17:30', title: '成田機場 ➔ 京成上野', type: 'transport', desc: '搭乘 Skyliner 前往上野' }
        ];

        for (const item of defaultSpots) {
          await addDoc(collection(db, "itinerary"), { ...item, createdAt: new Date() });
        }
      }
    }
  </script>
</body>
</html>
